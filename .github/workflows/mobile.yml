name: Mobile Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Install Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android NDK and SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" "platforms;android-35" "build-tools;35.0.0"

      - name: Install frontend dependencies
        run: |
          cd apps/desktop
          npm install

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake g++ libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install tauri-cli
        run: cargo install tauri-cli@2.5.0 --locked

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: |
          TC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$TC:$PATH"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export CC_armv7_linux_androideabi="$TC/armv7a-linux-androideabi24-clang"
          export CC_i686_linux_android="$TC/i686-linux-android24-clang"
          export CC_x86_64_linux_android="$TC/x86_64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TC/armv7a-linux-androideabi24-clang"
          export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$TC/i686-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export AR_armv7_linux_androideabi="$TC/llvm-ar"
          export AR_i686_linux_android="$TC/llvm-ar"
          export AR_x86_64_linux_android="$TC/llvm-ar"
          ln -sf "$TC/aarch64-linux-android24-clang" "$TC/aarch64-linux-android-clang" || true
          ln -sf "$TC/armv7a-linux-androideabi24-clang" "$TC/armv7-linux-androideabi-clang" || true
          ln -sf "$TC/armv7a-linux-androideabi24-clang" "$TC/arm-linux-androideabi-clang" || true
          ln -sf "$TC/i686-linux-android24-clang" "$TC/i686-linux-android-clang" || true
          ln -sf "$TC/x86_64-linux-android24-clang" "$TC/x86_64-linux-android-clang" || true
          cd apps/desktop
          sed -i 's/default = \[.*\]/default = \[\]/' src-tauri/Cargo.toml
          export RUST_BACKTRACE=1
          if ! cargo tauri android build --apk --ci --verbose --features mobile 2>&1 | tee /tmp/android_build.log; then
            echo "## ❌ Android Build Failure Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/android_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          cd ../..
          mkdir -p android-artifacts
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} android-artifacts/ \;
          echo "=== Found Android Build Artifacts ==="
          ls -lh android-artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: android-artifacts/*
          if-no-files-found: error

  upload-android-assets:
    name: Upload Android Assets to Release
    permissions:
      contents: write
    needs: [build-android]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apk
          path: artifacts

      - name: Collect APK assets
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} release/ \;
          cd release
          for f in *universal*.apk *.apk; do
            if [ -f "$f" ]; then
              cp "$f" HiveBear.apk
              break
            fi
          done
          sha256sum * > SHA256SUMS-android.txt

      - name: Upload Android assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG_NAME" release/* --repo "$REPO" --clobber
