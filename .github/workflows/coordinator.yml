name: Coordinator Binary

on:
  push:
    branches:
      - main
    paths:
      - "crates/hivebear-coordinator/**"
      - "crates/hivebear-mesh/src/karma.rs"
      - ".github/workflows/coordinator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-coordinator:
    name: Build Coordinator (linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: coordinator-linux-x86_64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: coordinator-linux-x86_64-

      - name: Build hivebear-coordinator
        run: cargo build --release -p hivebear-coordinator

      - name: Package tarball
        run: |
          cd target/release
          tar czf ../../hivebear-coordinator-x86_64-unknown-linux-gnu.tar.gz hivebear-coordinator
          cd ../..

      - name: Upload to latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          LATEST_TAG=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$LATEST_TAG" ]; then
            echo "Uploading prebuilt coordinator to release $LATEST_TAG..."
            gh release upload "$LATEST_TAG" hivebear-coordinator-x86_64-unknown-linux-gnu.tar.gz --repo "$REPO" --clobber
          else
            echo "No release found to attach coordinator binary."
          fi
