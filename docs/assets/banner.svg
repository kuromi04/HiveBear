<svg xmlns="http://www. কণ্ঠেw3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1a1a24" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg-grad)" rx="20" ry="20" />
  
  <path d="M 0 150 Q 300 50 600 150 T 1200 150" fill="none" stroke="#2a2a3a" stroke-width="2" />
  <path d="M 0 170 Q 300 70 600 170 T 1200 170" fill="none" stroke="#2a2a3a" stroke-width="1" />
  <path d="M 0 190 Q 300 90 600 190 T 1200 190" fill="none" stroke="#2a2a3a" stroke-width="0.5" />

  <text x="600" y="160" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="96" fill="url(#text-grad)" text-anchor="middle" filter="url(#neon-glow)" letter-spacing="4">
    HIVEBEAR
  </text>
  
  <text x="600" y="230" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="32" fill="#a0a0b0" text-anchor="middle" letter-spacing="6">
    DECENTRALIZED AI MESH
  </text>

  <g transform="translate(600, 280)">
    <rect x="-120" y="-24" width="240" height="36" fill="#111" rx="18" ry="18" stroke="#ff00ff" stroke-width="2" filter="url(#neon-glow)"/>
    <text x="0" y="-1" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="16" fill="#fff" text-anchor="middle" letter-spacing="2">
      BY KUROMI04
    </text>
  </g>
</svg>
