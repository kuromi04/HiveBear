version: '3.8'

services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    container_name: hivebear-coordinator
    ports:
      - "80:7879"
      - "7879:7879"
    volumes:
      - coordinator_data:/data
    restart: always
    environment:
      - RUST_LOG=hivebear_coordinator=info,info

volumes:
  coordinator_data:
